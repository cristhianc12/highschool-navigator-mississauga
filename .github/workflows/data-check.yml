name: Data and site checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install site and pipeline dependencies
        run: npm ci && npm ci --prefix scripts
      - name: Modules load
        run: |
          for f in js/*.js js/data/*.js api/*.js; do node --check "$f"; done
          node -e 'import("./js/content.js").then(m => console.log(m.SCHOOLS.length, "schools"))'
      - name: Validate collected data
        run: node scripts/pipeline/validate.mjs
      - name: Generated modules are up to date
        run: |
          node scripts/pipeline/build-details.mjs
          git diff --exit-code -- js/data
